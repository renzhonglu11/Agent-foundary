[project]
name = "tr-structured-products"
version = "0.1.0"
description = "Lightweight Trade Republic structured products enrichment pipeline."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tr_structured_products"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
