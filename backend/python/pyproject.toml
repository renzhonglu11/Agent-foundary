[project]
name = "agent-foundry-python"
version = "0.1.0"
description = "Python utilities used by the Agent Foundry backend."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "pymupdf>=1.24",
    "pydantic>=2.0.0",
    "playwright>=1.40.0",
    "yoyo-migrations>=9.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project.scripts]
agent-foundry-macro-analysis = "agent_foundry_python.macro_analysis:main"
agent-foundry-extract-pdf = "agent_foundry_python.pdf_extract:main"
agent-foundry-structured-products = "agent_foundry_python.structured_products.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_foundry_python"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
