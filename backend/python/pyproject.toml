[project]
name = "agent-foundry-python"
version = "0.1.0"
description = "Python utilities used by the Agent Foundry backend."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "pymupdf>=1.24",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tr_structured_products"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
